<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.5次元俳優 好き顔メーカー</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #fce4ec; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { padding: 10px 20px; margin: 10px; border: none; background-color: #ff4081; color: white; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn:hover { background-color: #e91e63; }
        
        /* ランキング（2択）用のスタイル */
        #battle-screen { display: none; }
        .battle-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .face-card { cursor: pointer; border: 2px solid transparent; border-radius: 10px; overflow: hidden; width: 150px; }
        .face-card:hover { border-color: #ff4081; }
        .face-card img { width: 100%; height: 150px; object-fit: cover; }
        
        /* 9マス画像作成用のスタイル */
        #grid-screen { display: none; }
        .actor-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .actor-item { width: 80px; cursor: pointer; text-align: center; font-size: 12px; }
        .actor-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 3px solid transparent; }
        .actor-item.selected img { border-color: #ff4081; }
        #canvas-container { margin-top: 20px; }
        canvas { border: 1px solid #ccc; max-width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>2.5次元俳優 好き顔メーカー</h1>
    <div id="menu">
        <button class="btn" onclick="startBattle()">2択でランキングを作る</button>
        <button class="btn" onclick="startGrid()">9マス好き顔一覧を作る</button>
    </div>

    <!-- 2択ランキング画面 -->
    <div id="battle-screen">
        <h2>どっちの顔が好き？</h2>
        <p>直感で選んでね！</p>
        <div class="battle-container">
            <div class="face-card" onclick="selectActor(0)">
                <img id="actor-left-img" src="" alt="">
                <h3 id="actor-left-name"></h3>
            </div>
            <div class="face-card" onclick="selectActor(1)">
                <img id="actor-right-img" src="" alt="">
                <h3 id="actor-right-name"></h3>
            </div>
        </div>
        <button class="btn" onclick="backToMenu()" style="background-color:#999; margin-top:30px;">メニューに戻る</button>
    </div>

    <!-- 9マス画像作成画面 -->
    <div id="grid-screen">
        <h2>好きな顔を9人選んでね (<span id="select-count">0</span>/9)</h2>
        <div class="actor-list" id="actor-list"></div>
        <button class="btn" onclick="generateGrid()">画像を生成する</button>
        <button class="btn" onclick="backToMenu()" style="background-color:#999;">メニューに戻る</button>
        
        <div id="canvas-container">
            <canvas id="bingoCanvas" width="600" height="600"></canvas>
            <p style="font-size:12px; color:#666;">※画像を長押し（または右クリック）で保存できます</p>
        </div>
    </div>
</div>

<script>
    // ★ここに俳優のデータを登録します
    // imgの部分には、用意した画像ファイルの名前を入れます
    const actorsData = [
        { id: 1, name: "後藤 大", img: "goto.jpg" },
        { id: 2, name: "荒牧 慶彦", img: "aramaki.jpg" },
        { id: 3, name: "佐藤 流司", img: "sato.jpg" },
        { id: 4, name: "高野 洸", img: "takano.jpg" },
        { id: 5, name: "植田 圭輔", img: "ueda.jpg" },
        { id: 6, name: "黒羽 麻璃央", img: "kuroba.jpg" },
        { id: 7, name: "和田 雅成", img: "wada.jpg" },
        { id: 8, name: "三浦 宏規", img: "miura.jpg" },
        { id: 9, name: "阿部 顕嵐", img: "abe.jpg" },
        { id: 10, name: "松田 凌", img: "matsuda.jpg" }
    ];

    let selectedForGrid = [];

    function backToMenu() {
        document.getElementById('menu').style.display = 'block';
        document.getElementById('battle-screen').style.display = 'none';
        document.getElementById('grid-screen').style.display = 'none';
    }

    /* --- 9マス画像作成機能 --- */
    function startGrid() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('grid-screen').style.display = 'block';
        renderActorList();
    }

    function renderActorList() {
        const listDiv = document.getElementById('actor-list');
        listDiv.innerHTML = '';
        actorsData.forEach(actor => {
            const div = document.createElement('div');
            div.className = 'actor-item';
            // ※画像がない環境でも枠が見えるようにプレースホルダー画像を使っています
            div.innerHTML = `<img src="${actor.img}" onerror="this.src='https://via.placeholder.com/80?text=No+Img'" alt="${actor.name}"><br>${actor.name}`;
            div.onclick = () => toggleSelect(actor, div);
            listDiv.appendChild(div);
        });
    }

    function toggleSelect(actor, element) {
        const index = selectedForGrid.findIndex(a => a.id === actor.id);
        if (index > -1) {
            selectedForGrid.splice(index, 1);
            element.classList.remove('selected');
        } else {
            if (selectedForGrid.length >= 9) {
                alert("すでに9人選ばれています！");
                return;
            }
            selectedForGrid.push(actor);
            element.classList.add('selected');
        }
        document.getElementById('select-count').innerText = selectedForGrid.length;
    }

    function generateGrid() {
        if (selectedForGrid.length !== 9) {
            alert("9人ぴったり選んでください！");
            return;
        }
        const canvas = document.getElementById('bingoCanvas');
        const ctx = canvas.getContext('2d');
        
        // 背景を白に
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 600, 600);
        
        // 3x3で画像を描画
        let loadedCount = 0;
        selectedForGrid.forEach((actor, index) => {
            const x = (index % 3) * 200;
            const y = Math.floor(index / 3) * 200;
            
            const img = new Image();
            img.onload = () => {
                // 画像を正方形にトリミングして描画
                ctx.drawImage(img, x, y, 200, 200);
                // 名前を文字で入れる
                ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
                ctx.fillRect(x, y + 170, 200, 30);
                ctx.fillStyle = "#000";
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(actor.name, x + 100, y + 190);
            };
            img.onerror = () => {
                // 画像読み込み失敗時の代わり
                ctx.fillStyle = "#f0f0f0";
                ctx.fillRect(x, y, 200, 200);
                ctx.fillStyle = "#333";
                ctx.font = "14px sans-serif";
                ctx.fillText("No Image", x + 100, y + 100);
            }
            img.src = actor.img; // 用意した画像のパス
        });
    }

    /* --- 2択ランキング機能（簡易版） --- */
    // ※本格的なソートアルゴリズム（マージソート等）を実装すると長くなるため、
    // まずはランダムに2人表示する仕組みのベースを記載しています。
    function startBattle() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('battle-screen').style.display = 'block';
        showNextBattle();
    }

    function showNextBattle() {
        // ランダムに2人選ぶ（実際はここに勝ち抜き戦のロジックを入れます）
        const shuffled = [...actorsData].sort(() => 0.5 - Math.random());
        
        document.getElementById('actor-left-name').innerText = shuffled[0].name;
        document.getElementById('actor-left-img').src = shuffled[0].img;
        document.getElementById('actor-left-img').onerror = function() { this.src='https://via.placeholder.com/150?text=No+Img'; };

        document.getElementById('actor-right-name').innerText = shuffled[1].name;
        document.getElementById('actor-right-img').src = shuffled[1].img;
        document.getElementById('actor-right-img').onerror = function() { this.src='https://via.placeholder.com/150?text=No+Img'; };
    }

    function selectActor(winnerIndex) {
        // 選ばれた時の処理。本格的なランキングを作る場合、勝敗データを記録して次へ進む
        showNextBattle();
    }
</script>

</body>
</html>
